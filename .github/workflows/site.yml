# Builds the marketing site (apps/web) and deploys it to GitHub Pages.
# Pull requests only run the build, so a broken page is caught before merge.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "tools/build-site.mjs"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "tools/build-site.mjs"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node tools/build-site.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
